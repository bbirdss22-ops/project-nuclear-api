name: Deploy to Development

on:
  push:
    branches: [dev]

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

      # Deploy to Render (dev service) — ใช้ Deploy Hook URL จาก Render dashboard
      - name: Deploy to Render (dev)
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_DEV }}

  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      # Vercel auto-deploys on push to dev (preview) — แค่ verify build ผ่าน
